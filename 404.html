<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedScheme = localStorage.getItem('color-scheme');
      if (savedScheme === 'light' || savedScheme === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = savedScheme;
      }
    } catch (_) {}
  </script>
  <title>404 - WebStack</title>
  <meta name="robots" content="noindex, follow">
  <link rel="shortcut icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/styles.css?v=2.0.0">
</head>
<body data-i18n-title-key="title_404">
  <main class="error-shell">
    <section class="surface-card error-card">
      <p class="error-code">404</p>
      <h1 data-i18n="error_404_heading">页面走丢了</h1>
      <p data-i18n="error_404_desc">您访问的页面不存在或已被移除，可以返回导航首页继续浏览。</p>
      <a href="index.html" class="btn-primary" data-i18n="back_home">返回首页</a>
    </section>
  </main>

  <script defer src="assets/js/i18n.js?v=2.0.0"></script>
</body>
</html>
